<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <radialGradient id="holyGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#022C22" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="15%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="rehalWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2511" />
      <stop offset="50%" stop-color="#6B3718" />
      <stop offset="100%" stop-color="#34180A" />
    </linearGradient>

    <filter id="goldDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Soft Aura Glow -->
  <circle cx="300" cy="360" r="240" fill="url(#holyGlow)" />

  <!-- Outer Islamic Arch Frame -->
  <path d="M 100 600 
           L 100 280 
           C 100 170, 200 90, 300 40 
           C 400 90, 500 170, 500 280 
           L 500 600" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="3" 
        stroke-dasharray="6,4"
        opacity="0.75" />

  <!-- Middle Decorative Arch with Pointed Keystone Accent -->
  <path d="M 120 600 
           L 120 290 
           C 120 190, 210 120, 300 70 
           C 390 120, 480 190, 480 290 
           L 480 600" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        opacity="0.9" />

  <!-- Inner Arch Silhouette with Islamic Arabesque Motifs -->
  <path d="M 140 600 
           L 140 300 
           C 140 210, 220 145, 300 100 
           C 380 145, 460 210, 460 300 
           L 460 600" 
        fill="url(#emeraldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.5" 
        filter="url(#goldDropShadow)" />

  <!-- Arabesque Arch Apex Finial -->
  <g transform="translate(300, 40)">
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" />
    <path d="M 0 -22 L 6 -10 L 0 0 L -6 -10 Z" fill="url(#goldGrad)" />
    <path d="M 0 -26 L 2 -22 L -2 -22 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-30" r="3" fill="url(#goldGrad)" />
    <!-- Crescent on top -->
    <path d="M -5 -40 A 6 6 0 1 0 4 -32 A 4.8 4.8 0 1 1 -5 -40" fill="url(#goldGrad)" />
  </g>

  <!-- Hanging Mosque Lantern (Fanous) -->
  <g transform="translate(300, 100)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Lantern Top -->
    <path d="M -14 40 L 14 40 L 10 48 L -10 48 Z" fill="url(#goldGrad)" />
    <path d="M -10 48 L 10 48 L 16 70 L -16 70 Z" fill="#FDF3B8" opacity="0.85" />
    <path d="M -16 70 L 16 70 L 0 85 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="90" r="3" fill="url(#goldGrad)" />
    <!-- Lantern Glow -->
    <circle cx="0" cy="59" r="16" fill="#FBF0B9" opacity="0.35" filter="url(#goldDropShadow)" />
  </g>

  <!-- Decorative Islamic Stars on Left and Right of Arch -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <!-- Left Star 8-point -->
    <g transform="translate(180, 220) scale(0.6)">
      <polygon points="0,15 11,11 15,0 19,11 30,15 19,19 15,30 11,19"/>
      <polygon points="0,15 11,11 15,0 19,11 30,15 19,19 15,30 11,19" transform="rotate(45 15 15)"/>
    </g>
    <!-- Right Star 8-point -->
    <g transform="translate(390, 220) scale(0.6)">
      <polygon points="0,15 11,11 15,0 19,11 30,15 19,19 15,30 11,19"/>
      <polygon points="0,15 11,11 15,0 19,11 30,15 19,19 15,30 11,19" transform="rotate(45 15 15)"/>
    </g>
  </g>

  <!-- REHAL (Traditional Wooden Quran Stand) -->
  <g id="rehal" transform="translate(0, 50)" filter="url(#goldDropShadow)">
    <!-- Back Leg Left -->
    <path d="M 230 460 L 180 530 L 210 540 L 270 460 Z" fill="#2E1407" />
    <!-- Back Leg Right -->
    <path d="M 370 460 L 420 530 L 390 540 L 330 460 Z" fill="#2E1407" />
    
    <!-- Front Leg Left to Right Intersecting Plank -->
    <path d="M 180 390 L 410 535 L 390 545 L 160 405 Z" fill="url(#rehalWood)" stroke="url(#goldGrad)" stroke-width="1.2" />
    <!-- Front Leg Right to Left Intersecting Plank -->
    <path d="M 420 390 L 190 535 L 210 545 L 440 405 Z" fill="url(#rehalWood)" stroke="url(#goldGrad)" stroke-width="1.2" />

    <!-- Carved Arch Detail on Rehal Base -->
    <path d="M 260 520 C 300 495, 300 495, 340 520 Z" fill="url(#goldGrad)" opacity="0.6" />
    <circle cx="300" cy="468" r="5" fill="url(#goldGrad)" />
  </g>

  <!-- OPEN HOLY QURAN -->
  <g id="open-quran" transform="translate(0, 30)" filter="url(#goldDropShadow)">
    <!-- Book Cover Silhouette (Leather Dark Emerald & Gold Trim) -->
    <path d="M 155 385 C 220 375, 275 390, 298 405 L 298 412 C 275 397, 220 382, 155 392 Z" fill="#0A3327" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M 445 385 C 380 375, 325 390, 302 405 L 302 412 C 325 397, 380 382, 445 392 Z" fill="#0A3327" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Left Open Page Stack (Thickness effect) -->
    <path d="M 160 380 C 225 370, 280 385, 298 398 L 298 403 C 280 390, 225 375, 160 385 Z" fill="#C5BCA5" />
    <!-- Right Open Page Stack -->
    <path d="M 440 380 C 375 370, 320 385, 302 398 L 302 403 C 320 390, 375 375, 440 385 Z" fill="#C5BCA5" />

    <!-- Left Main Page Surface -->
    <path d="M 162 375 C 225 365, 282 380, 299 394 L 299 315 C 282 300, 225 285, 162 295 Z" fill="url(#pageGradLeft)" stroke="#E2D7BE" stroke-width="1" />
    <!-- Right Main Page Surface -->
    <path d="M 438 375 C 375 365, 318 380, 301 394 L 301 315 C 318 300, 375 285, 438 295 Z" fill="url(#pageGradRight)" stroke="#E2D7BE" stroke-width="1" />

    <!-- Gold Calligraphic Inner Borders on Quran Pages -->
    <path d="M 172 365 C 225 356, 275 370, 290 382 L 290 324 C 275 312, 225 298, 172 307 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
    <path d="M 428 365 C 375 356, 325 370, 310 382 L 310 324 C 325 312, 375 298, 428 307 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />

    <!-- Ornate Page Headers (Unwan / Surah banner) -->
    <path d="M 180 312 C 225 304, 260 314, 282 322 L 282 329 C 260 321, 225 311, 180 319 Z" fill="url(#goldGrad)" />
    <path d="M 420 312 C 375 304, 340 314, 318 322 L 318 329 C 340 321, 375 311, 420 319 Z" fill="url(#goldGrad)" />

    <!-- Calligraphic Script Texture Lines (representing Quranic verses) -->
    <g stroke="#3A2C18" stroke-width="1.6" stroke-linecap="round" opacity="0.65">
      <!-- Left Page Verses -->
      <line x1="185" y1="332" x2="278" y2="339" />
      <line x1="183" y1="340" x2="279" y2="347" />
      <line x1="181" y1="348" x2="280" y2="355" />
      <line x1="180" y1="356" x2="281" y2="363" />
      <line x1="178" y1="364" x2="283" y2="371" />

      <!-- Right Page Verses -->
      <line x1="322" y1="339" x2="415" y2="332" />
      <line x1="321" y1="347" x2="417" y2="340" />
      <line x1="320" y1="355" x2="419" y2="348" />
      <line x1="319" y1="363" x2="420" y2="356" />
      <line x1="317" y1="371" x2="422" y2="364" />
    </g>

    <!-- Golden Aya Marker rosettes in margins -->
    <circle cx="176" cy="336" r="3" fill="url(#goldGrad)" />
    <circle cx="175" cy="352" r="3" fill="url(#goldGrad)" />
    <circle cx="424" cy="336" r="3" fill="url(#goldGrad)" />
    <circle cx="425" cy="352" r="3" fill="url(#goldGrad)" />

    <!-- Center Binding Spine Ribbon (Bookmark / Tahfeez Silk) -->
    <path d="M 300 310 Q 303 360 297 420 Q 292 450 310 470" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="310,470 304,482 316,482" fill="url(#goldGrad)" />
  </g>

  <!-- Glowing spiritual particles / stars floating around the Quran -->
  <g fill="#FDE68A" opacity="0.75">
    <circle cx="210" cy="270" r="2" />
    <circle cx="390" cy="265" r="2.5" />
    <circle cx="280" cy="240" r="1.5" />
    <circle cx="330" cy="235" r="2" />
    <circle cx="150" cy="340" r="1.5" />
    <circle cx="450" cy="335" r="1.5" />
    <circle cx="230" cy="420" r="2" />
    <circle cx="370" cy="415" r="2" />
  </g>
</svg>
