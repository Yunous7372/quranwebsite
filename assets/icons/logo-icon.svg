<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#1E1035" />
    </linearGradient>
  </defs>

  <!-- Background Shield / Star Base -->
  <rect x="15" y="15" width="70" height="70" rx="16" fill="url(#logoEmerald)" stroke="url(#logoGold)" stroke-width="2.5" />
  <rect x="15" y="15" width="70" height="70" rx="16" fill="none" stroke="url(#logoGold)" stroke-width="1.5" transform="rotate(45 50 50)" opacity="0.65" />

  <!-- Center Circle Frame -->
  <circle cx="50" cy="50" r="28" fill="#1E1035" stroke="url(#logoGold)" stroke-width="1.5" />

  <!-- Stylized Open Quran on Stand -->
  <!-- Left Page -->
  <path d="M 33 54 C 38 52, 45 53, 49 56 L 49 42 C 45 39, 38 38, 33 40 Z" fill="#FEF3C7" stroke="url(#logoGold)" stroke-width="0.8" />
  <!-- Right Page -->
  <path d="M 67 54 C 62 52, 55 53, 51 56 L 51 42 C 55 39, 62 38, 67 40 Z" fill="#FEF3C7" stroke="url(#logoGold)" stroke-width="0.8" />

  <!-- Bookstand Rehal Silhouette -->
  <path d="M 40 56 L 50 66 L 60 56 M 44 65 L 56 65" fill="none" stroke="url(#logoGold)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Crescent & Star on top of Quran -->
  <path d="M 49 33 A 4.5 4.5 0 1 0 54 39 A 3.8 3.8 0 1 1 49 33" fill="url(#logoGold)" />
  <circle cx="54" cy="34" r="1.2" fill="url(#logoGold)" />
</svg>
