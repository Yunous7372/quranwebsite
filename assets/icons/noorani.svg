<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="goldNoor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="38" fill="#2E1065" stroke="url(#goldNoor)" stroke-width="2"/>
  <!-- Wooden Tablet (Lawh) -->
  <path d="M 24 22 L 56 22 C 58 22, 60 24, 60 26 L 60 62 C 60 64, 58 66, 56 66 L 24 66 C 22 66, 20 64, 20 62 L 20 26 C 20 24, 22 22, 24 22 Z" fill="#7C3AED" stroke="url(#goldNoor)" stroke-width="1.5"/>
